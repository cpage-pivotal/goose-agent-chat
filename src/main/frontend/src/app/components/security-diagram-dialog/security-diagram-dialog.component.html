<div class="m3-dialog-header">
  <div class="hero-icon">
    <mat-icon>security</mat-icon>
  </div>
  <div class="header-text">
    <h2 class="dialog-title" mat-dialog-title>How Credential Brokering Works</h2>
    <p class="supporting">End-to-end walkthrough · 8 steps</p>
  </div>
</div>

<mat-dialog-content>
  <span class="sr-only" aria-live="polite" aria-atomic="true">{{ currentStepLabel() }}</span>

  <div class="diagram-layout">
    <div class="diagram-card">
      <svg class="diagram-svg" viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg"
           role="img" aria-labelledby="diag-title diag-desc">
        <title id="diag-title">How Credential Brokering Works</title>
        <desc id="diag-desc">Eight-step sequence: SSO token, delegation token exchange, credential request, broker validation checks, grant verification, target fetch, and ResourceAccessToken return.</desc>
        <defs>
          <marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-primary" />
          </marker>
          <marker id="arrow-tertiary" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-tertiary" />
          </marker>
        </defs>

        <!-- Platform boundary -->
        <rect class="platform-boundary" x="20" y="40" width="920" height="500" rx="16" />
        <text class="platform-label" x="480" y="64">Tanzu Platform (Cloud Foundry)</text>

        <!-- C2C network boundary -->
        <rect class="c2c-boundary" x="40" y="90" width="540" height="270" rx="12" />
        <text class="c2c-label" x="310" y="112">C2C Network · cf add-network-policy · mTLS required</text>

        <!-- Column labels -->
        <text class="lane-label" x="740" y="118">Broker checks</text>
        <text class="lane-label" x="480" y="398">Backing services</text>

        <!-- Agent node -->
        <g class="node" [class.emphasized]="isEmphasized(1)">
          <rect x="60" y="140" width="200" height="180" rx="12" />
          <text x="160" y="170" class="node-title">Goose Agent Chat</text>
          <text x="160" y="190" class="node-sub">CF Instance Identity Cert</text>
          <line x1="76" y1="206" x2="244" y2="206" stroke="var(--mat-sys-outline-variant)" stroke-dasharray="3 3" />
          <text x="76" y="226" class="cert-detail">OU = organization:...</text>
          <text x="76" y="246" class="cert-detail">OU = space:...</text>
          <text x="76" y="266" class="cert-detail">OU = app:...</text>
          <text x="76" y="300" class="node-sub-left">+ User SSO access token</text>
        </g>

        <!-- Broker node -->
        <g class="node" [class.emphasized]="isEmphasized(2)">
          <rect x="360" y="140" width="200" height="180" rx="12" />
          <text x="460" y="170" class="node-title">Credential Broker</text>
          <text x="460" y="190" class="node-sub">.apps.internal:8443</text>
          <text x="460" y="210" class="node-sub">mTLS Required</text>
          <line x1="376" y1="226" x2="544" y2="226" stroke="var(--mat-sys-outline-variant)" stroke-dasharray="3 3" />
          <text x="460" y="248" class="verify-label">VALIDATION PIPELINE</text>
          <text x="460" y="285" class="node-sub">Each request passes</text>
          <text x="460" y="302" class="node-sub">all three checks →</text>
        </g>

        <!-- Check node 1: Workload Identity -->
        <g class="check-node" [class.on]="isCheckOn(5)">
          <rect x="600" y="140" width="280" height="44" rx="8" />
          <circle cx="624" cy="162" r="11" fill="var(--mat-sys-surface-container-lowest)" stroke="var(--mat-sys-outline-variant)" />
          <text x="624" y="162" class="check-num">1</text>
          <text x="644" y="162" class="check-text">Workload Identity (mTLS cert)</text>
        </g>

        <!-- Check node 2: Delegation Token -->
        <g class="check-node" [class.on]="isCheckOn(5)">
          <rect x="600" y="194" width="280" height="44" rx="8" />
          <circle cx="624" cy="216" r="11" fill="var(--mat-sys-surface-container-lowest)" stroke="var(--mat-sys-outline-variant)" />
          <text x="624" y="216" class="check-num">2</text>
          <text x="644" y="216" class="check-text">Delegation Token (JWT)</text>
        </g>

        <!-- Check node 3: User Grant -->
        <g class="check-node" [class.on]="isCheckOn(6)">
          <rect x="600" y="248" width="280" height="44" rx="8" />
          <circle cx="624" cy="270" r="11" fill="var(--mat-sys-surface-container-lowest)" stroke="var(--mat-sys-outline-variant)" />
          <text x="624" y="270" class="check-num">3</text>
          <text x="644" y="270" class="check-text">User Grant (active?)</text>
        </g>

        <!-- SSO node -->
        <g class="node" [class.emphasized]="isEmphasized(1)">
          <rect x="60" y="415" width="200" height="80" rx="12" />
          <text x="160" y="445" class="node-title">Tanzu SSO Service</text>
          <text x="160" y="465" class="node-sub">Issues user's access token</text>
          <text x="160" y="482" class="node-sub">p-identity</text>
        </g>

        <!-- PostgreSQL node -->
        <g class="node" [class.emphasized]="isEmphasized(6)">
          <rect x="360" y="415" width="200" height="80" rx="12" />
          <text x="460" y="445" class="node-title">PostgreSQL</text>
          <text x="460" y="465" class="node-sub">Grants + Delegations</text>
        </g>

        <!-- MCP Server node -->
        <g class="node" [class.emphasized]="isEmphasized(7)">
          <rect x="680" y="415" width="220" height="80" rx="12" />
          <text x="790" y="445" class="node-title">MCP Server</text>
          <text x="790" y="465" class="node-sub">GitHub, CF, etc.</text>
        </g>

        <!-- Step 1: SSO → Agent (upward) -->
        <g class="step" [attr.opacity]="stepOpacity(1)">
          <path d="M 160,415 L 160,320" class="flow-line" marker-end="url(#arrow-primary)"
                [attr.stroke-dashoffset]="lineDashOffset(1)" />
          <rect class="annot" x="180" y="356" width="108" height="22" rx="11" />
          <text class="annot-text" x="234" y="367">User SSO token</text>
          <circle cx="160" cy="367" r="13" class="step-badge" />
          <text x="160" y="367" class="step-num-text">1</text>
        </g>

        <!-- Step 2: Agent → Broker mTLS token exchange (rail 1) -->
        <g class="step" [attr.opacity]="stepOpacity(2)">
          <path d="M 260,200 L 360,200" class="flow-line mtls-line" marker-end="url(#arrow-primary)"
                [attr.stroke-dashoffset]="lineDashOffset(2)" />
          <rect class="annot" x="260" y="165" width="100" height="22" rx="11" />
          <text class="annot-text" x="310" y="176">Exchange (mTLS)</text>
          <circle cx="310" cy="200" r="13" class="step-badge" />
          <text x="310" y="200" class="step-num-text">2</text>
        </g>

        <!-- Step 3: Broker → Agent delegation JWT (rail 2, return) -->
        <g class="step" [attr.opacity]="stepOpacity(3)">
          <path d="M 360,234 L 260,234" class="flow-line flow-return" fill="none" marker-end="url(#arrow-tertiary)"
                [attr.stroke-dashoffset]="lineDashOffset(3)" />
          <rect class="annot" x="260" y="244" width="100" height="22" rx="11" />
          <text class="annot-text" x="310" y="255">Delegation JWT</text>
          <circle cx="310" cy="234" r="13" class="step-badge return" />
          <text x="310" y="234" class="step-num-text">3</text>
        </g>

        <!-- Step 4: Agent → Broker credential request (rail 3, mTLS) -->
        <g class="step" [attr.opacity]="stepOpacity(4)">
          <path d="M 260,288 L 360,288" class="flow-line mtls-line" marker-end="url(#arrow-primary)"
                [attr.stroke-dashoffset]="lineDashOffset(4)" />
          <rect class="annot" x="260" y="298" width="100" height="22" rx="11" />
          <text class="annot-text" x="310" y="309">Credential req</text>
          <circle cx="310" cy="288" r="13" class="step-badge" />
          <text x="310" y="288" class="step-num-text">4</text>
        </g>

        <!-- Step 5: Broker → validation checks -->
        <g class="step" [attr.opacity]="stepOpacity(5)">
          <path d="M 560,216 L 600,216" class="flow-line" marker-end="url(#arrow-primary)"
                [attr.stroke-dashoffset]="lineDashOffset(5)" />
          <circle cx="580" cy="216" r="13" class="step-badge" />
          <text x="580" y="216" class="step-num-text">5</text>
        </g>

        <!-- Step 6: Broker → PostgreSQL -->
        <g class="step" [attr.opacity]="stepOpacity(6)">
          <path d="M 460,320 L 460,415" class="flow-line" marker-end="url(#arrow-primary)"
                [attr.stroke-dashoffset]="lineDashOffset(6)" />
          <rect class="annot" x="482" y="357" width="100" height="22" rx="11" />
          <text class="annot-text" x="532" y="368">Verify Grant</text>
          <circle cx="460" cy="368" r="13" class="step-badge" />
          <text x="460" y="368" class="step-num-text">6</text>
        </g>

        <!-- Step 7: Broker → MCP Server (diagonal) -->
        <g class="step" [attr.opacity]="stepOpacity(7)">
          <path d="M 560,300 L 760,415" class="flow-line" marker-end="url(#arrow-primary)"
                [attr.stroke-dashoffset]="lineDashOffset(7)" />
          <rect class="annot" x="588" y="335" width="120" height="22" rx="11" />
          <text class="annot-text" x="648" y="346">Fetch Credential</text>
          <circle cx="660" cy="358" r="13" class="step-badge" />
          <text x="660" y="358" class="step-num-text">7</text>
        </g>

        <!-- Step 8: Broker → Agent ResourceAccessToken (rail 4, topmost return) -->
        <g class="step" [attr.opacity]="stepOpacity(8)">
          <path d="M 360,160 L 260,160" class="flow-line flow-return" fill="none" marker-end="url(#arrow-tertiary)"
                [attr.stroke-dashoffset]="lineDashOffset(8)" />
          <rect class="annot" x="248" y="126" width="124" height="22" rx="11" />
          <text class="annot-text" x="310" y="137">ResourceAccessToken</text>
          <circle cx="310" cy="160" r="13" class="step-badge return" />
          <text x="310" y="160" class="step-num-text">8</text>
        </g>

      </svg>
    </div>

    <nav class="flow-stepper" role="tablist" aria-label="Credential brokering steps">
      @for (step of flowSteps; track step.label; let i = $index) {
        <button class="step-row" role="tab"
                [class.active]="isActive(i)"
                [class.done]="isDone(i)"
                (click)="goToStep(i + 1)">
          <div class="step-dot">
            @if (isDone(i)) {
              <mat-icon>check</mat-icon>
            } @else {
              {{ i + 1 }}
            }
          </div>
          <div>
            <div class="step-item-label">{{ step.label }}</div>
            <div class="step-item-sub">{{ step.sub }}</div>
          </div>
        </button>
      }
    </nav>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="replay()">
    <mat-icon>replay</mat-icon>
    Replay
  </button>
  <button mat-flat-button (click)="close()">Close</button>
</mat-dialog-actions>
