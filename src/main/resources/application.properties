spring.application.name=goose-agent-chat

# Goose Configuration
goose.enabled=true

# Async configuration for SSE streaming
spring.mvc.async.request-timeout=600000

# Disable response buffering for streaming
server.tomcat.max-swallow-size=-1

# Agent Credential Broker integration (set via env var or cf set-env)
# When set, the broker is used for credential acquisition instead of direct OAuth
broker.base-url=${BROKER_BASE_URL:}
broker.public-url=${BROKER_PUBLIC_URL:}

# Shared password used by the form-login fallback when OIDC login is not configured.
# Ignored in OAuth2 mode.
app.auth.secret=${APP_AUTH_SECRET:changeme}

# OAuth2 login via Keycloak lives in application-oauth.properties, activated by the
# "oauth" Spring profile (SPRING_PROFILES_ACTIVE=oauth on CF). Gating it behind a
# profile preserves the PASSWORD-mode fallback: with no profile, no OAuth2 client
# registration exists, so OAuth2ClientProperties validation never runs.
