# OAuth2 login via Keycloak (kuhn-labs realm), activated by the "oauth" profile.
# Replaces the former agent-sso/UAA binding that java-cfenv-boot-pivotal-sso used to
# auto-configure. Presence of this registration makes AuthModeProvider select OAUTH2
# mode (a ClientRegistrationRepository bean is created).
#
# Required env vars (set via vars.yaml -> manifest.yml on CF):
#   OIDC_ISSUER_URI, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET
spring.security.oauth2.client.registration.sso.provider=sso
spring.security.oauth2.client.registration.sso.client-id=${OIDC_CLIENT_ID}
spring.security.oauth2.client.registration.sso.client-secret=${OIDC_CLIENT_SECRET}
spring.security.oauth2.client.registration.sso.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.sso.scope=openid,email,profile
spring.security.oauth2.client.registration.sso.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.sso.issuer-uri=${OIDC_ISSUER_URI}
spring.security.oauth2.client.provider.sso.user-name-attribute=preferred_username
